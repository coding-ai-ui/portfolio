<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta
      name="description"
      content="Houssam El Orabi — creative web developer and software creator from Algeria. Explore my projects, skills, and approach to thoughtful digital experiences."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Houssam El Orabi — Developer & Creator</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("portfolio-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
